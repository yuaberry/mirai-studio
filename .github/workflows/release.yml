name: release

# Multi-platform release builds (v0.16+): the desktop can only build Linux
# packages locally — Windows installers, macOS disk images and the Android
# companion APK are built here, on REAL runners for each platform.
on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run rebuild:native
      # Linux ships sharp's WebAssembly build: Electron's Linux binary links
      # the system glib and leaks its symbols into the process, which
      # collides with the glib embedded in sharp's native libvips and aborts
      # the app (electron/electron#46323). See apps/desktop/scripts/
      # prepare-sharp-runtime.mjs.
      - run: node apps/desktop/scripts/prepare-sharp-runtime.mjs --platform linux
      - run: node apps/desktop/scripts/fetch-ffmpeg.mjs --platform linux
      - run: cd apps/desktop && bunx electron-vite build && bunx electron-builder --linux deb AppImage
      # Release gate: boot the PACKAGED app. Unit tests and the dev build
      # cannot see packaging regressions (a native module missing from the
      # app archive kills the main process → the window never appears).
      - name: Packaged boot smoke
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth
          xvfb-run -a --server-args="-screen 0 1280x800x24" node apps/desktop/scripts/smoke-packaged.mjs apps/desktop/release/linux-unpacked/mirai-studio
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run rebuild:native
      # Windows keeps sharp's native runtime (no glib conflict there).
      - run: node apps/desktop/scripts/prepare-sharp-runtime.mjs --platform win32
      - run: node apps/desktop/scripts/fetch-ffmpeg.mjs --platform win32
      - run: cd apps/desktop && bunx electron-vite build
      - run: cd apps/desktop && bunx electron-builder --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned installer
      # No display on the Windows runner — validate the native runtime
      # closure (sharp + @img binary) inside the built package.
      - name: Packaged static smoke
        run: node apps/desktop/scripts/smoke-packaged.mjs apps/desktop/release/win-unpacked/mirai-studio.exe --static-only
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run rebuild:native
      # macOS keeps sharp's native runtime (no glib conflict there).
      - run: node apps/desktop/scripts/prepare-sharp-runtime.mjs --platform darwin
      - run: node apps/desktop/scripts/fetch-ffmpeg.mjs --platform darwin
      - run: cd apps/desktop && bunx electron-vite build
      - run: cd apps/desktop && bunx electron-builder --mac dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned dmg — users right-click → Open
      # No display guarantee on the macOS runner — validate the native
      # runtime closure (sharp + @img binary) inside the built package.
      - name: Packaged static smoke
        run: |
          BIN=$(find apps/desktop/release -maxdepth 5 -type f -name "mirai-studio" -path "*MacOS*" | head -1)
          test -n "$BIN" || { echo "macOS binary not found"; exit 1; }
          node apps/desktop/scripts/smoke-packaged.mjs "$BIN" --static-only
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: cd apps/mobile && bun run build && bunx cap sync android
      - run: cd apps/mobile/android && ./gradlew assembleDebug --no-daemon
      - name: rename apk
        run: mv apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk apps/mobile/mirai-companion-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/*.apk
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach to the release
        run: gh release upload "${{ github.ref_name }}" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release summary
        run: ls -la artifacts/
